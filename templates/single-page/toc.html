<section class="slide" data-layout="toc">
  <div class="slide-content">
    <div class="wrap" style="max-width:min(94vw,1080px)">
      <div class="eyebrow reveal" style="--i:0">{{eyebrow}}</div>
      <h2 class="reveal" style="--i:1">{{title}}</h2>
      <div class="{{cols}} toc-grid" style="margin-top:clamp(1rem,2.4vh,1.6rem)">
        {{#items}}
        <div class="glass toc-card reveal" style="--i:{{i}}">
          <div class="toc-num" aria-hidden="true"></div>
          <h3>{{item.label}}</h3>
          <p>{{item.desc}}</p>
        </div>
        {{/items}}
      </div>
    </div>
  </div>
</section>
