<section class="slide" data-layout="two-column">
  <div class="slide-content">
    <div class="wrap composition-shell">
      <div class="eyebrow reveal" style="--i:0">{{eyebrow}}</div>
      <h2 class="reveal" style="--i:1">{{title}}</h2>
      <div class="construct-split" style="margin-top:1rem">
        <div class="construct-copy reveal" style="--i:2">{{left}}</div>
        <div class="glass construct-anchor tilt reveal" style="--i:3">{{right}}</div>
      </div>
    </div>
  </div>
</section>
