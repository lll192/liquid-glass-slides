<section class="slide" data-layout="two-column">
  <div class="slide-content">
    <div class="wrap" style="max-width:min(94vw,1040px)">
      <div class="eyebrow reveal" style="--i:0">{{eyebrow}}</div>
      <h2 class="reveal" style="--i:1">{{title}}</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:clamp(1rem,3vw,2.5rem);align-items:center;margin-top:1rem">
        <div class="reveal" style="--i:2">{{left}}</div>
        <div class="glass tilt reveal" style="--i:3;padding:clamp(1.2rem,2.6vw,2rem)">{{right}}</div>
      </div>
    </div>
  </div>
</section>
