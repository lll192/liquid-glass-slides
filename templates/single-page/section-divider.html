<section class="slide" data-layout="section-divider">
  <div class="slide-content">
    <div class="wrap" style="max-width:min(92vw,900px);text-align:center">
      {{#hero}}
      <figure class="photo-frame reveal" style="--i:0;margin:0 auto 1rem;max-width:min(92vw,600px)">
        <img src="{{hero}}" alt="{{hero_alt}}" style="height:min(24vh,220px)">
      </figure>
      {{/hero}}
      <div class="qbadge reveal" style="--i:0">{{num}}</div>
      <h1 class="reveal" style="--i:1">{{title}}</h1>
      <p class="lead reveal" style="--i:2;margin:.4em auto 0">{{subtitle}}</p>
    </div>
  </div>
</section>
