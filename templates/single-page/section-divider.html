<section class="slide" data-layout="section-divider">
  <div class="slide-content">
    <div class="wrap composition-shell section-composition">
      {{#hero}}
      <figure class="photo-frame section-hero reveal" style="--i:0">
        <img src="{{hero}}" alt="{{hero_alt}}" style="height:min(24vh,220px)">
      </figure>
      {{/hero}}
      <div class="qbadge reveal" style="--i:0">{{num}}</div>
      <h1 class="reveal" style="--i:1">{{title}}</h1>
      <p class="lead reveal" style="--i:2">{{subtitle}}</p>
    </div>
  </div>
</section>
