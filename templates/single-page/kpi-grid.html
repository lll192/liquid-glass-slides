<section class="slide" data-layout="kpi-grid">
  <div class="slide-content">
    <div class="wrap" style="max-width:min(94vw,1000px)">
      <div class="eyebrow reveal" style="--i:0">{{eyebrow}}</div>
      <h2 class="reveal" style="--i:1">{{title}}</h2>
      <div class="{{cols}}" style="margin-top:1rem">
        {{#items}}
        <div class="glass reveal" style="--i:{{i}};text-align:center;padding:clamp(1rem,2.2vw,1.6rem)">
          <div class="num" style="font-size:clamp(1.8rem,4vw,2.8rem)">{{item.num}}</div>
          <div style="color:var(--ink);font-weight:600;font-size:var(--body-size)">{{item.label}}</div>
        </div>
        {{/items}}
      </div>
    </div>
  </div>
</section>
