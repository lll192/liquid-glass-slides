<section class="slide" data-layout="bullets">
  <div class="slide-content">
    <div class="wrap" style="max-width:min(94vw,980px)">
      <div class="eyebrow reveal" style="--i:0">{{eyebrow}}</div>
      <h2 class="reveal" style="--i:1">{{title}}</h2>
      <div class="lrows" style="margin-top:clamp(.8rem,2vh,1.4rem)">
        {{#items}}
        <div class="glass lrow reveal" style="--i:{{i}}">
          <span class="lrow-dot" aria-hidden="true"></span>
          <div class="lrow-body">
            <h3>{{item.text}}</h3>
            <p>{{item.desc}}</p>
          </div>
        </div>
        {{/items}}
      </div>
    </div>
  </div>
</section>
