<section class="slide" data-layout="cover">
  <div class="slide-content">
    <div class="wrap cover-layout">
      <div class="cover-copy">
        <div class="eyebrow reveal" style="--i:0">{{eyebrow}}</div>
        <h1 class="reveal" style="--i:1">{{title}}</h1>
        <p class="lead reveal" style="--i:2">{{subtitle}}</p>
      </div>
      {{#hero}}
      <figure class="photo-frame cover-hero reveal" style="--i:0">
        <img src="{{hero}}" alt="{{hero_alt}}">
      </figure>
      {{/hero}}
    </div>
  </div>
</section>
