<section class="slide" data-layout="data-table">
  <div class="slide-content">
    <div class="wrap composition-shell">
      {{#eyebrow}}<div class="eyebrow reveal" style="--i:0">{{eyebrow}}</div>{{/eyebrow}}
      <h2 class="reveal" style="--i:1">{{title}}</h2>
      <div class="data-table-shell glass construct-plane reveal" style="--i:2">
        <table class="data-table">
          <thead><tr>{{table_head}}</tr></thead>
          <tbody>{{table_rows}}</tbody>
        </table>
      </div>
      {{#caption}}<p class="footnote table-caption reveal" style="--i:3">{{caption}}</p>{{/caption}}
    </div>
  </div>
</section>
