<section class="slide" data-layout="big-quote">
  <div class="slide-content">
    <div class="wrap" style="max-width:min(90vw,880px);text-align:center">
      <div class="glass reveal" style="--i:0;padding:clamp(1.4rem,3.6vw,2.8rem)">
        <blockquote style="font-size:clamp(1.25rem,3vw,2.2rem);line-height:1.35;margin:0;color:var(--ink);font-weight:600">「{{quote}}」</blockquote>
        <div style="margin-top:1em;font-size:var(--small-size);letter-spacing:.16em;color:var(--muted);text-transform:uppercase">{{by}}</div>
      </div>
    </div>
  </div>
</section>
