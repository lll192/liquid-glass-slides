<section class="slide" data-layout="image-frame">
  <div class="slide-content">
    <div class="wrap composition-shell image-composition">
      <div class="eyebrow reveal" style="--i:0">{{eyebrow}}</div>
      <h2 class="reveal" style="--i:1">{{title}}</h2>
      <figure class="photo-frame image-field reveal" style="--i:2">
        <img src="{{image}}" alt="{{alt}}">
        {{#caption}}<figcaption>{{caption}}</figcaption>{{/caption}}
      </figure>
    </div>
  </div>
</section>
