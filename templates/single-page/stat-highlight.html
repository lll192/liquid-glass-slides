<section class="slide" data-layout="stat-highlight">
  <div class="slide-content">
    <div class="wrap composition-shell stat-composition">
      <div class="stat-copy">
        <div class="eyebrow reveal" style="--i:0">{{eyebrow}}</div>
        <h2 class="reveal" style="--i:2">{{title}}</h2>
        <p class="lead reveal" style="--i:3">{{desc}}</p>
      </div>
      <div class="stat-anchor reveal" style="--i:1">{{num}}<span>{{unit}}</span></div>
    </div>
  </div>
</section>
