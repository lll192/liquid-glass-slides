<section class="slide" data-layout="stat-highlight">
  <div class="slide-content">
    <div class="wrap" style="max-width:min(92vw,860px);text-align:center">
      <div class="eyebrow reveal" style="--i:0">{{eyebrow}}</div>
      <div class="reveal" style="--i:1;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--accent);
        font-size:clamp(3.4rem,11vw,8rem);font-variant-numeric:tabular-nums;margin:.1em 0">{{num}}<span style="font-size:.4em;color:var(--muted)">{{unit}}</span></div>
      <h2 class="reveal" style="--i:2">{{title}}</h2>
      <p class="lead reveal" style="--i:3;margin:.3em auto 0">{{desc}}</p>
    </div>
  </div>
</section>
