<section class="slide" data-layout="comparison">
  <div class="slide-content">
    <div class="wrap composition-shell">
      <div class="eyebrow reveal" style="--i:0">{{eyebrow}}</div>
      <h2 class="reveal" style="--i:1">{{title}}</h2>
      <div class="compare construct-compare construct-plane glass reveal" style="--i:2;margin-top:1rem">
        <div class="compare-side">
          <h3 class="accent" style="margin-bottom:.6em">{{left_title}}</h3>
          <ul class="bullets">
            {{#left_items}}
            <li style="padding-left:1.4em;position:relative;margin-bottom:.8em;color:var(--ink)">{{item.text}}</li>
            {{/left_items}}
          </ul>
        </div>
        <div class="vs" aria-hidden="true">VS</div>
        <div class="compare-side">
          <h3 class="accent" style="margin-bottom:.6em">{{right_title}}</h3>
          <ul class="bullets">
            {{#right_items}}
            <li style="padding-left:1.4em;position:relative;margin-bottom:.8em;color:var(--ink)">{{item.text}}</li>
            {{/right_items}}
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
