<section class="slide" data-layout="timeline">
  <div class="slide-content">
    <div class="wrap composition-shell">
      <div class="eyebrow reveal" style="--i:0">{{eyebrow}}</div>
      <h2 class="reveal" style="--i:1">{{title}}</h2>
      <div class="glass construct-plane reveal" style="--i:2">
        <div class="tline">
          {{#items}}
          <div class="titem" style="--i:{{i}}"><span>{{item.year}}</span><b>{{item.head}}</b> —— {{item.desc}}</div>
          {{/items}}
        </div>
      </div>
    </div>
  </div>
</section>
